<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @font-face {
            font-family: 'Milany';
            src: url('fonts/Milany-Regular.otf') format('opentype'); 
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Nahla';
            src: url('fonts/Nahla Script.otf') format('opentype');
            font-weight: normal;
            font-style: normal;

            /* Tipos de Format:
               -opentype (otf)
               -truetype (ttf)
               -embedded-opentype
               -truetype-aat (Apple Advanced Typography) */
        }
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        h1 {
            font-family: 'Milany', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
        p {
            font-family: 'Nahla';
            font-size: 1em;
            font-weight: normal;
        }
    </style>
    <title>Fontes Externas</title>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quasi, repudiandae vero. Sequi natus labore neque molestiae iure nisi commodi architecto quidem officiis id eveniet, delectus quos cupiditate! Iste, consequuntur mollitia.</p>
</body>
</html>
