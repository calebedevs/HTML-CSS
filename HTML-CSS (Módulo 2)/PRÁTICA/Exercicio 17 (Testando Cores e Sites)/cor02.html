<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradientes em CSS</title>
    <style>
        * {  /* Configuraçôees globais do CSS */
            height: 100%;
        }
        body {
            background-image: linear-gradient(to right, white, blue) /* Direita */
            background-image: linear-gradient(to top, white, blue) /* Cima */
            background-image: linear-gradient(to bottom, white, blue) /* Baixo */
            background-image: linear-gradient(to left, white, blue) /* Esquerda */
        }
    </style>
</head>
<body>
    <h1>Testando Gradientes</h1>

</body>
</html>
