<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradientes em CSS</title>
    <style>
        * {  /* Configuraçôees globais do CSS */
            height: 100%;
        }
        body {  /* DICA: Não exagerar em cores, 3 a 5 cores em gradientes */
            background-image: linear-gradient(to bottom, white, #D2FFFC,#B2FFFF, #80ECFF, #67B4FC, #508BFF, #274DEA, #151BFF);
            background-attachment: fixed;
            text-align: center;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Testando Gradientes</h1>

</body>
</html>
